<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hot Wheels 2025 Collectors Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">🔥 Hot Wheels 2025</div>
      <nav>
        <button onclick="renderHome()">Home</button>
        <button onclick="renderShop(1)">Shop</button>
        <button onclick="renderCart()">Cart (<span id="cart-count">0</span>)</button>
        <button onclick="renderWishlist()">Wishlist</button>
        <button onclick="toggleFilter()">Filters</button>
      </nav>
    </div>
  </header>

  <main id="content"></main>

  <footer>
    <small>© 2025 Hot Wheels Collectors — For display/collector use only.</small>
  </footer>

  <!-- Filter popup placeholder (created by JS) -->
  <script src="script.js"></script>
</body>
</html>
